base_config: &BASE_CONFIG

    # metadata file for the dataset
    metadata_json_path: "datasets/era5/data_era5.json"

    # data 
    train_data_path: "/data/weatherbench2_original/"
    valid_data_path: "/data/weatherbench2_original/"
    exp_dir: "runs"
    n_years: 1
    img_shape_x: 721
    img_shape_y: 1440
    data_type: "zarr"

    # files used for normalization of the data
    time_means_path:   "/stats/time_means.npy"
    global_means_path: "era5_stats_69channels/global_mean.npy"
    global_stds_path:  "era5_stats_69channels/global_std.npy"
    
    # architecture related 
    nettype: "SFNO"
    model_grid_type: "equiangular"
    sht_grid_type: "legendre-gauss"
    filter_type: "linear"
    scale_factor: 3
    embed_dim: 128
    num_layers: 4
    complex_activation: "real"
    normalization_layer: "instance_norm"
    hard_thresholding_fraction: 1.0
    use_mlp: !!bool True
    mlp_mode: "serial"
    mlp_ratio: 2
    separable: !!bool False
    operator_type: "dhconv"
    activation_function: "gelu"
    pos_embed: "none" # "none", "direct" or "frequency". For resoltuion invariance, use add_grid instead or use "frequency"

    # training parameters
    loss: "weighted squared geometric l2"
    channel_weights: "auto"
    lr: 1E-3
    n_eval_samples: 16
    max_epochs: 40
    batch_size: 4
    weight_decay: 5E-6

    # scheduler parameters
    scheduler: "StepLR" # "ReduceLROnPlateau" or "CosineAnnealingLR"
    scheduler_T_max: 70
    scheduler_factor: 0.1
    scheduler_patience: 10
    scheduler_step_size: 100
    scheduler_gamma: 0.5
    lr_warmup_steps: 0

    # general
    verbose: !!bool False

    # wireup stuff
    wireup_info: "mpi"
    wireup_store: "tcp"

    num_data_workers: 2
    num_visualization_workers: 2
    dt: 1 # how many timesteps ahead the model will predict
    n_history: 0 # how many previous timesteps to consider
    prediction_type: "iterative"
    prediction_length: 35 # applicable only if prediction_type == "iterative"
    n_initial_conditions: 5 # applicable only if prediction_type == "iterative"
    valid_autoreg_steps: 1 # number of autoregressive steps for validation, 20 steps in total

    # we make the "epochs" shorter so we have more reporting
    n_train_samples_per_epoch: 54000

    ics_type: "specify_number"
    save_raw_forecasts: !!bool True
    save_channel: !!bool False
    masked_acc: !!bool False
    maskpath: None
    perturb: !!bool False
    add_noise: !!bool False
    noise_std: 0.

    target: "default" # options default, residual
    normalize_residual: false

    # define channels to be read from data
    # 100u, 100v not available in the data
    channel_names: ["10u", "10v", 
                    # "100u", "100v", 
                    "t2m", "msl", 
                    "u50", "u100", "u150", "u200", "u250", "u300", "u400", "u500", "u600", "u700", "u850", "u925", "u1000", 
                    "v50", "v100", "v150", "v200", "v250", "v300", "v400", "v500", "v600", "v700", "v850", "v925", "v1000", 
                    "z50", "z100", "z150", "z200", "z250", "z300", "z400", "z500", "z600", "z700", "z850", "z925", "z1000", 
                    "t50", "t100", "t150", "t200", "t250", "t300", "t400", "t500", "t600", "t700", "t850", "t925", "t1000", 
                    "q50", "q100", "q150", "q200", "q250", "q300", "q400", "q500", "q600", "q700", "q850", "q925", "q1000"]
    normalization: "zscore" # options zscore or minmax or none

    # extra channelss
    add_grid: !!bool True
    gridtype: "sinusoidal"
    grid_num_frequencies: 16
    roll: !!bool False
    add_zenith: !!bool False # disable zenith for now
    # invariants
    add_orography: !!bool True 
    orography_path: "era5_stats_69channels/orography.npy"
    add_landmask: !!bool True 
    landmask_path: "era5_stats_69channels/land_mask.npy"

    finetune: !!bool False

    # logging options
    log_to_screen: !!bool True
    log_to_wandb: !!bool False # not tested yet, TODO
    log_video: 20 # if > 0 will log every i-th epoch
    save_checkpoint: "legacy"

    optimizer_type: "AdamW"
    optimizer_beta1: 0.9
    optimizer_beta2: 0.95
    optimizer_max_grad_norm: 32
    crop_size_x: None
    crop_size_y: None

    # required for validation and scoring
    inf_data_path: "/out_of_sample"

    # Weights and biases configuration
    wandb_name: None # If None, wandb will assign a random name, recommended
    wandb_group: "sfnonet-training-debug" # If None, will be "era5_wind" + config, but you can override it here
    wandb_project: "sfno"
    wandb_entity: "your_wandb_entity"s

